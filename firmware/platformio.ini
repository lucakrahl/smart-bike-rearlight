; PlatformIO — Smart Bike Rear Light Firmware
; Board: AZ-Delivery ESP32 NodeMCU DevKit C V2  ->  generic "esp32dev"
; ESP32 Arduino Core v3.x (ledcAttach/ledcWrite API, CON-02/PWM)

[platformio]
default_envs = esp32dev

; --------------------------------------------------------------------------
; Zielhardware (ESP32) — Firmware bauen/flashen/monitoren
; --------------------------------------------------------------------------
[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino

monitor_speed = 115200          ; Serial-Monitor + Konfig-Interface (FR-CFG-02)
upload_speed = 921600

; No-OTA / große App-Partition fuer die BLE-Firmware (CON-03)
board_build.partitions = huge_app.csv

; Bibliotheken (Bible Kap. 6.2). Versionen nach erstem erfolgreichem
; Resolve pinnen (Reproduzierbarkeit, NFR) — z. B. "@ 2.2.6".
lib_deps =
    adafruit/Adafruit MPU6050
    adafruit/Adafruit BMP280 Library
    adafruit/Adafruit Unified Sensor
    mikalhart/TinyGPSPlus
    sui77/rc-switch

build_flags =
    -D CORE_DEBUG_LEVEL=3
    ; WiFi bleibt aus (NFR-PWR-01) — nur BLE wird genutzt.
    -I include   ; config.h (FR-CFG-01) fuer lib/logic + lib/drivers

; --------------------------------------------------------------------------
; Host-Unit-Tests der reinen Logik (ohne ESP32) — NFR-TST-03
; Testet ausschliesslich firmware/lib/logic (hardwarefrei)
; --------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -I include   ; config.h (FR-CFG-01) fuer Logik-Module ohne Arduino.h
